<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qoutes Gen Z</title>
    <style>
        h1{ font-size: 47px;
            text-align: center;
            text-transform:uppercase;
            font-style: italic;
             letter-spacing: 10px;
             text-decoration: underline;
             text-decoration-style: wavy;
             text-decoration-color:black;
             text-shadow: 5px 5px 0 grey
             ;}

            p{
                font-family: 'Courier New', Courier, monospace;
                font-weight: bold;
                color:grey;
                text-align: center;
            }

            quotes{
                font-size: 22px;
                line-height: 2.2;
                 word-spacing: 5px;
                 ;
            }

            span{
                color:crimson;
                text-decoration: line-through;
            }

            credit{
                font-size: 12px;
                letter-spacing: 2px;
                color:grey;
            }
    </style>
</head>
<body>
    <h1>Cahaya</h1>
    <p class="quotes">"Jangan sibuk menjadi cahaya di mata <span>orang lain</span>, 
        <br>
        sampai lupa bahwa gelap pun punya caranya sendiri untuk mengajarkan arti terang."
        <br>🖤</p>
    <p class="credit">"Tapi Ini Bukan tentang Cahaya"</p>
</body>
</html>
